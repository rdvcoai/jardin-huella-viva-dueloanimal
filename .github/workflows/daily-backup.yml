name: Daily Encrypted Supabase Backup & Quota Check

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily (01:00 COT)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run encrypted PostgreSQL & Storage backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_DIR: backups/daily
        run: |
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "FAIL-CLOSED: BACKUP_ENCRYPTION_KEY secret is required in public repository"
            exit 1
          fi
          node scripts/backup-supabase.mjs
      - name: Upload encrypted backup artifact (30d retention, $0 cost)
        uses: actions/upload-artifact@v4
        with:
          name: jhv-supabase-backup-enc-${{ github.run_number }}
          path: backups/daily
          retention-days: 30
